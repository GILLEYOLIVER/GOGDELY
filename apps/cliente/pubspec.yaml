name: gogdely_cliente
description: "GOGDELY Cliente - Flutter prototype with QR and maps"
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  gogdely_design_system:
    path: ../../packages/design_system
  gogdely_local_demo_api:
    path: ../../packages/local_demo_api
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  mobile_scanner: ^7.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
