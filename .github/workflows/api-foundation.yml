name: GOGDELY API foundation

on:
  pull_request:
    paths:
      - '.github/workflows/api-foundation.yml'
      - 'services/api/**'
      - 'database/**'
  push:
    branches: [develop]
    paths:
      - '.github/workflows/api-foundation.yml'
      - 'services/api/**'
      - 'database/**'

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'services/api[test]'
      - run: python -m pip check
      - run: python -m pytest services/api/tests -q
