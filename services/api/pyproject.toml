[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gogdely-api"
version = "0.1.0"
description = "GOGDELY API bootstrap — local only"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "qrcode>=8.2,<9"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gogdely_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
